name: Feature request
description: Suggest something palsc should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Reads your local Schema Generator output and, with `--submit`, opens a pull request against the public registry using the token you supply.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution. What got in your way?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
